name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP boundary dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install engine dependencies actually imported
        # NOTE: ml/requirements.txt is stale (lists sentence-transformers, omits fastembed/
        # numpy/scikit-learn/rapidfuzz) - see docs/evaluation.md defect E3. CI installs the
        # runtime deps the code imports so tests and the bm25 benchmark can run.
        run: python -m pip install "tiktoken>=0.7,<1" "rank-bm25>=0.2,<1" "numpy>=1.26" "scikit-learn>=1.4"

      - name: Verify engine tokenizer
        run: python -c "from ml.src.tokenizer import get_encoder; assert get_encoder().name == 'cl100k_base'"

      - name: Lint validation-owned paths
        run: python -m ruff check scripts

      - name: Contract consistency
        run: python scripts/check_contract.py

      - name: Tests
        run: python -m pytest -q

      - name: Benchmark (bm25, verified tokenizer)
        run: python scripts/evaluate.py --scorers bm25 --require-tokenizer --output data/processed/ci-results.json
