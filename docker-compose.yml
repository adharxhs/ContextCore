services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./ml/models:/srv/ml/models
      - ./data:/srv/data
  # The dashboard service is added after the Frontend owner selects its framework.
