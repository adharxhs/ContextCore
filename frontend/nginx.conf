server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
  }
  location ~* \.(?:css|html|js)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
